name: financial_calculator
description: A comprehensive financial calculator application with modern UI.

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  get: ^4.6.6
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  pdf: ^3.10.0
  printing: ^5.11.0
  share_plus: ^7.2.0
  flutter_svg: ^2.0.0
  syncfusion_flutter_charts: ^24.1.41
  math_expressions: ^3.1.0
  fl_chart: ^0.63.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/calcutic.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
