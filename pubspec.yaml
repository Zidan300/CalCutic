name: financial_calculator
description: A comprehensive financial calculator application with modern UI.

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  get: ^4.6.6
  intl: ^0.20.2
  shared_preferences: ^2.2.3 # Added this line to fix the error
  path_provider: ^2.1.0
  pdf: ^3.10.0
  printing: ^5.11.0
  share_plus: ^12.0.1
  flutter_svg: ^2.0.0
  math_expressions: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
